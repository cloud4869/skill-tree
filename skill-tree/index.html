<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code スキルツリー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ヘッダー -->
  <header id="header">
    <h1>🌳 Claude Code スキルツリー</h1>
    <div id="progress-summary">
      <span id="progress-text">読み込み中...</span>
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    <button id="reset-btn" onclick="resetProgress()">リセット</button>
  </header>

  <!-- 凡例 -->
  <div id="legend">
    <span class="legend-item untouched">未着手</span>
    <span class="legend-item learning">学習中</span>
    <span class="legend-item mastered">習得済み</span>
    <span style="font-size:0.72rem;color:#6060a0;margin-left:auto;">
      ノードをクリックして状態を更新 | Escキーでモーダルを閉じる
    </span>
  </div>

  <!-- スキルツリー本体 -->
  <div id="tree-wrapper">
    <div id="tree-container">
      <svg id="connections-svg"></svg>
      <div id="nodes-container"></div>
    </div>
  </div>

  <!-- ─────────────────────────────────────
       スキル詳細モーダル
  ───────────────────────────────────── -->
  <div id="modal-overlay" onclick="closeModal()">
    <div id="modal" onclick="event.stopPropagation()">

      <button id="modal-close" onclick="closeModal()" title="閉じる（Esc）">✕</button>

      <!-- ヘッダー -->
      <div id="modal-header">
        <span id="modal-icon"></span>
        <div>
          <h2 id="modal-name"></h2>
          <span id="modal-group"></span>
        </div>
      </div>

      <!-- 前提スキル警告 -->
      <div id="prereq-warning"></div>

      <!-- ステータス変更 -->
      <div id="modal-status">
        <label>状態:</label>
        <div id="status-buttons">
          <button class="status-btn" data-status="未着手"  onclick="setStatus('未着手')">未着手</button>
          <button class="status-btn" data-status="学習中"  onclick="setStatus('学習中')">学習中</button>
          <button class="status-btn" data-status="習得済み" onclick="setStatus('習得済み')">習得済み</button>
        </div>
      </div>

      <!-- 達成条件 -->
      <div class="modal-section">
        <h3>🎯 達成条件</h3>
        <p id="modal-achievement"></p>
      </div>

      <!-- やり方 -->
      <div class="modal-section">
        <h3>🔧 実際のやり方</h3>
        <p id="modal-howto"></p>
      </div>

      <!-- 確認方法 -->
      <div class="modal-section">
        <h3>✅ 確認方法</h3>
        <p id="modal-verification"></p>
      </div>

      <!-- メモ -->
      <div class="modal-section">
        <h3>📝 メモ（自由記入）</h3>
        <textarea id="modal-notes" placeholder="気づき・詰まった点・参考URLなどを自由に記入..."></textarea>
      </div>

      <!-- フッター -->
      <div id="modal-footer">
        <span id="modal-date"></span>
        <button id="save-btn" onclick="saveSkill()">保存する</button>
      </div>

    </div>
  </div>

</div><!-- #app -->

<script src="js/skills.js"></script>
<script src="js/app.js"></script>
</body>
</html>
